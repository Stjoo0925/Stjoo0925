</style><rect width="860" height="640" fill="#f2eee5"/><text x="48" y="50" class="k">01 · FEATURE</text><text x="812" y="50" class="k" text-anchor="end">FROM THE FIELD TO THE CODE</text><line x1="48" y1="66" x2="812" y2="66" stroke="#141414" stroke-width="2"/><line x1="48" y1="71" x2="812" y2="71" stroke="#141414" stroke-width="0.6"/><g><text x="48" y="142" class="h1">From the field</text><text x="48" y="200" class="h1">to the code.</text></g><g><line x1="48" y1="236" x2="108" y2="236" stroke="#c2410c" stroke-width="3"/><text x="48" y="274" class="q">“I’d rather understand the friction</text><text x="48" y="302" class="q">than just ship the feature.”</text></g><g><text x="470" y="112" class="b">For four years I worked in civil engineering</text><text x="470" y="133" class="b">and urban development: gathering requirements,</text><text x="470" y="154" class="b">aligning stakeholders, and pushing projects</text><text x="470" y="175" class="b">through to the end. The same manual work kept</text><text x="470" y="196" class="b">coming back, and so did one question:</text><text x="470" y="217" class="b">could a tool fix this?</text><text x="470" y="248" class="b">So I learned to build the tool. Today I take a</text><text x="470" y="269" class="b">problem from the first client conversation to</text><text x="470" y="290" class="b">a service that actually runs, with AI in every</text><text x="470" y="311" class="b">step and the final call still on me.</text></g><line x1="48" y1="352" x2="812" y2="352" stroke="#141414" stroke-width="0.6"/><text x="48" y="388" class="k">TIMELINE</text><text x="812" y="388" class="kr" text-anchor="end">CERTIFIED AI TRAINING DATA SPECIALIST, LV. 2</text><line x1="48" y1="470" x2="812" y2="470" stroke="#141414" stroke-width="1"/><g><circle cx="53.0" cy="470" r="5" fill="#141414"/><text x="48.0" y="452" class="yr">2019 — 2023</text><text x="48.0" y="504" class="t" style="font-size:18px">Landmark &amp; Co.</text><text x="48.0" y="528" class="s">Assistant manager, civil &amp;</text><text x="48.0" y="547" class="s">urban development. 4 years</text><text x="48.0" y="566" class="s">on site with clients.</text></g><g><circle cx="244.0" cy="470" r="5" fill="#141414"/><text x="239.0" y="452" class="yr">2024</text><text x="239.0" y="504" class="t" style="font-size:18px">Hi-Media Academy</text><text x="239.0" y="528" class="s">Full-stack track: React,</text><text x="239.0" y="547" class="s">Spring, Docker, CI/CD. Then</text><text x="239.0" y="566" class="s">a generative-AI track.</text></g><g><circle cx="435.0" cy="470" r="5" fill="#141414"/><text x="430.0" y="452" class="yr">2024</text><text x="430.0" y="504" class="t" style="font-size:18px">Team lead</text><text x="430.0" y="528" class="s">Narrativa, Leafresh,</text><text x="430.0" y="547" class="s">Afterburner. Planning, scope,</text><text x="430.0" y="566" class="s">schedules, and code.</text></g><g><circle cx="626.0" cy="470" r="5" fill="#c2410c"/><text x="621.0" y="452" class="yr">2025 —</text><text x="621.0" y="504" class="t" style="font-size:18px">Youscon R&amp;D Lab</text><text x="621.0" y="528" class="s">Researcher. Turning client</text><text x="621.0" y="547" class="s">needs into services that</text><text x="621.0" y="566" class="s">run on-prem.</text></g><line x1="48" y1="610" x2="812" y2="610" stroke="#141414" stroke-width="2"/></svg>