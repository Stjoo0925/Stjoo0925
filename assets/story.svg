<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 860 640" role="img" aria-label="From the field to the code. Four years in civil engineering and urban development at Landmark &amp; Co. (2019–2023), full-stack and generative-AI training at Hi-Media Academy (2024), team lead on Narrativa, Leafresh and Afterburner, and researcher at Youscon R&amp;D Lab since 2025."><style>
.k{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:3px;fill:#141414;font-weight:600}
.kr{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:3px;fill:#c2410c;font-weight:600}
.big{font-family:Georgia,'Times New Roman',Times,serif;font-weight:700;fill:#141414;font-size:132px;letter-spacing:-5px}
.h1{font-family:Georgia,'Times New Roman',Times,serif;font-weight:700;fill:#141414;font-size:52px;letter-spacing:-1.5px}
