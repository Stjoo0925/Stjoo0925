</style><rect width="860" height="700" fill="#f2eee5"/><text x="48" y="50" class="k">01 · FEATURE</text><text x="812" y="50" class="k" text-anchor="end">FROM THE FIELD TO THE CODE</text><line x1="48" y1="66" x2="812" y2="66" stroke="#141414" stroke-width="2"/><line x1="48" y1="71" x2="812" y2="71" stroke="#141414" stroke-width="0.6"/><g><text x="48" y="142" class="h1">From the field</text><text x="48" y="200" class="h1">to the code.</text></g><g><line x1="48" y1="222" x2="108" y2="222" stroke="#c2410c" stroke-width="3"/><text x="48" y="252" class="q" style="font-size:18px">“More than building features,</text><text x="48" y="276" class="q" style="font-size:18px">I focus on understanding what</text><text x="48" y="300" class="q" style="font-size:18px">users struggle with and what the</text><text x="48" y="324" class="q" style="font-size:18px">business needs, then turning it</text><text x="48" y="348" class="q" style="font-size:18px">into a service.”</text></g><g><text x="470" y="112" class="b">I studied construction systems engineering and</text><text x="470" y="133" class="b">spent four years in civil engineering and real</text><text x="470" y="154" class="b">estate, working with clients and stakeholders</text><text x="470" y="175" class="b">on site. Solving real problems by building</text><text x="470" y="196" class="b">things with technology is what pulled me into IT.</text><text x="470" y="240" class="b">Since April 2025 I have been a web developer at</text><text x="470" y="261" class="b">Youscon, a surveying solutions company, where</text><text x="470" y="282" class="b">my construction background and my code meet.</text></g><line x1="48" y1="370" x2="812" y2="370" stroke="#141414" stroke-width="0.6"/><text x="48" y="402" class="k">CAREER</text><line x1="48" y1="470" x2="812" y2="470" stroke="#141414" stroke-width="1"/><g><circle cx="53.0" cy="470" r="5" fill="#141414"/><text x="48.0" y="452" class="yr">2019.07 — 2023.08</text><text x="48.0" y="504" class="t" style="font-size:18px">Landmark &amp; Co.</text><text x="48.0" y="528" class="s">Civil engineering and real</text><text x="48.0" y="547" class="s">estate. Clients, stakeholders</text><text x="48.0" y="566" class="s">and requirements, on site.</text></g><g><circle cx="244.0" cy="470" r="5" fill="#141414"/><text x="239.0" y="452" class="yr">2024.04 — 2024.12</text><text x="239.0" y="504" class="t" style="font-size:18px">Hi-Media Academy</text><text x="239.0" y="528" class="s">Full-stack with cloud CI/CD</text><text x="239.0" y="547" class="s">(Java, Vue, Flutter), then a</text><text x="239.0" y="566" class="s">generative-AI course as mentor.</text></g><g><circle cx="435.0" cy="470" r="5" fill="#141414"/><text x="430.0" y="452" class="yr">2024</text><text x="430.0" y="504" class="t" style="font-size:18px">Team lead</text><text x="430.0" y="528" class="s">Narrativa, Leafresh,</text><text x="430.0" y="547" class="s">Afterburner. Planning, lead,</text><text x="430.0" y="566" class="s">schedules and development.</text></g><g><circle cx="626.0" cy="470" r="5" fill="#c2410c"/><text x="621.0" y="452" class="yr">2025.04 —</text><text x="621.0" y="504" class="t" style="font-size:18px">Youscon R&amp;D Lab</text><text x="621.0" y="528" class="s">Researcher, web development.</text><text x="621.0" y="547" class="s">Web CAD surveying, company</text><text x="621.0" y="566" class="s">site, an Apps in Toss app.</text></g><line x1="48" y1="586" x2="812" y2="586" stroke="#d6d0c2"/><text x="48" y="618" class="kr">EDUCATION</text><text x="48" y="642" class="s" style="fill:#141414">Soongsil Cyber University · Construction Systems Engineering · 2020 — 2024 · GPA 3.76 / 4.5</text><text x="812" y="618" class="kr" text-anchor="end">CERTIFICATE</text><text x="812" y="642" class="s" style="fill:#141414" text-anchor="end">AI Training Data Specialist, Lv. 2</text><line x1="48" y1="670" x2="812" y2="670" stroke="#141414" stroke-width="2"/></svg>