</style><rect width="860" height="758" fill="#f2eee5"/><text x="48" y="50" class="k">02 · SELECTED WORK</text><text x="812" y="50" class="k" text-anchor="end">TEAM PROJECTS AND THE LAB</text><line x1="48" y1="66" x2="812" y2="66" stroke="#141414" stroke-width="2"/><line x1="48" y1="71" x2="812" y2="71" stroke="#141414" stroke-width="0.6"/><text x="48" y="112" class="it" style="font-size:20px">From planning to a running service, alone or as the lead.</text><text x="48" y="156" class="k">TEAM PROJECTS</text><text x="812" y="156" class="kr" text-anchor="end">PLANNING · LEAD · LLM</text><line x1="48" y1="168" x2="812" y2="168" stroke="#141414" stroke-width="0.6"/><text x="48.0" y="206" class="n">01</text><text x="76.0" y="206" class="t">Narrativa</text><text x="48.0" y="230" class="yr" style="font-size:10px">2024.11 — 12 · 6 WEEKS · TEAM OF 6</text><text x="48.0" y="256" class="s">Interactive storytelling game on</text><text x="48.0" y="274" class="s">generative AI: the story branches</text><text x="48.0" y="292" class="s">with every choice the player makes.</text><text x="48.0" y="324" class="q" style="font-size:13.5px">Planning, design, schedule, task split</text><text x="48.0" y="348" class="m">React · TypeScript · Spring · AWS</text><text x="312.0" y="206" class="n">02</text><text x="340.0" y="206" class="t">Leafresh</text><text x="312.0" y="230" class="yr" style="font-size:10px">2024.08 — 10 · 6 WEEKS · TEAM OF 6</text><text x="312.0" y="256" class="s">SNS-style gardening community:</text><text x="312.0" y="274" class="s">plant care logs, a community</text><text x="312.0" y="292" class="s">feed, and ways to connect.</text><text x="312.0" y="324" class="q" style="font-size:13.5px">Planning and lead, Git Flow setup</text><text x="312.0" y="348" class="m">Vue · Pinia · Spring · Jenkins</text><line x1="298.0" y1="188" x2="298.0" y2="354" stroke="#d6d0c2"/><text x="576.0" y="206" class="n">03</text><text x="604.0" y="206" class="t">Afterburner</text><text x="576.0" y="230" class="yr" style="font-size:10px">2024.10 — ONGOING · TEAM OF 7</text><text x="576.0" y="256" class="s">Career growth platform for trainees</text><text x="576.0" y="274" class="s">in government-funded programs,</text><text x="576.0" y="292" class="s">from service design to code.</text><text x="576.0" y="324" class="q" style="font-size:13.5px">Planning and lead, end to end</text><text x="576.0" y="348" class="m">React · Tailwind · Supabase</text><line x1="562.0" y1="188" x2="562.0" y2="354" stroke="#d6d0c2"/><text x="48" y="420" class="k">LAB</text><text x="812" y="420" class="kr" text-anchor="end">MINI APPS · VS CODE · DESKTOP</text><line x1="48" y1="432" x2="812" y2="432" stroke="#141414" stroke-width="0.6"/><text x="48.0" y="472" class="n">04</text><text x="78.0" y="472" class="t">FairTrip</text><text x="410.0" y="472" class="yr" style="font-size:10px" text-anchor="end">APPS IN TOSS · V1.4.1</text><text x="78.0" y="496" class="q" style="font-size:15px">Split trip costs fairly, inside Toss.</text><text x="78.0" y="520" class="s">Logs every expense, even flights paid weeks</text><text x="78.0" y="538" class="s">ahead, and finds the fewest transfers.</text><text x="78.0" y="564" class="m">React · Cloudflare Workers · Hono · D1</text><line x1="48.0" y1="580" x2="410.0" y2="580" stroke="#d6d0c2"/><text x="450.0" y="472" class="n">05</text><text x="480.0" y="472" class="t">오늘모해</text><text x="812.0" y="472" class="yr" style="font-size:10px" text-anchor="end">APPS IN TOSS</text><text x="480.0" y="496" class="q" style="font-size:15px">A web app that lives inside Toss.</text><text x="480.0" y="520" class="s">Built with Next.js and Fastify, deployed to</text><text x="480.0" y="538" class="s">GCP Cloud Run, integrated with Toss.</text><text x="480.0" y="564" class="m">Next.js · Fastify · Firebase · Cloud Run</text><line x1="450.0" y1="580" x2="812.0" y2="580" stroke="#d6d0c2"/><text x="48.0" y="600" class="n">06</text><text x="78.0" y="600" class="t">MarkUI</text><text x="410.0" y="600" class="yr" style="font-size:10px" text-anchor="end">VS CODE · V1.2.1</text><text x="78.0" y="624" class="q" style="font-size:15px">A React-powered Markdown preview.</text><text x="78.0" y="648" class="s">Builds title, TOC and metadata automatically</text><text x="78.0" y="666" class="s">and follows your VS Code color theme.</text><text x="78.0" y="692" class="m">TypeScript · React · Webview</text><line x1="48.0" y1="708" x2="410.0" y2="708" stroke="#d6d0c2"/><text x="450.0" y="600" class="n">07</text><text x="480.0" y="600" class="t">Renam</text><text x="812.0" y="600" class="yr" style="font-size:10px" text-anchor="end">DESKTOP</text><text x="480.0" y="624" class="q" style="font-size:15px">Sort and batch-rename images, any OS.</text><text x="480.0" y="648" class="s">Rules by order, date or regex, with preview</text><text x="480.0" y="666" class="s">and undo. Runs in Docker too.</text><text x="480.0" y="692" class="m">Python · Docker · GUI</text><line x1="450.0" y1="708" x2="812.0" y2="708" stroke="#d6d0c2"/><line x1="48" y1="728" x2="812" y2="728" stroke="#141414" stroke-width="2"/></svg>