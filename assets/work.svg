<svg xmlns="http://www.w3.org/2000/svg" width="860" height="724" viewBox="0 0 860 724" role="img" aria-label="Selected work: Web CAD On-Prem — Self-hosted CAD and point-cloud platform.; Remote Control — In-house remote support, no TeamViewer.; Git Scoop — Code genealogy from Git history.; MyTeam — A token-efficient agent orchestrator.; LayLingo — Translate a PDF where it stands.; Gitagotchi — A pet that grows with your commits.; please_readme — GitHub profile cards, rendered on the edge.; DSA — Keeps a sleepy database awake."><style>
