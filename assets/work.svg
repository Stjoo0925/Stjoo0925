</style><rect width="860" height="724" fill="#f2eee5"/><text x="48" y="50" class="k">02 · SELECTED WORK</text><text x="812" y="50" class="k" text-anchor="end">THINGS THAT ACTUALLY RUN</text><line x1="48" y1="66" x2="812" y2="66" stroke="#141414" stroke-width="2"/><line x1="48" y1="71" x2="812" y2="71" stroke="#141414" stroke-width="0.6"/><text x="48" y="112" class="it" style="font-size:20px">Mostly problems someone handed me, solved end to end.</text><g><text x="48.0" y="150" class="n">01</text><text x="78.0" y="150" class="t">Web CAD On-Prem</text><text x="78.0" y="174" class="q" style="font-size:15px">Self-hosted CAD and point-cloud platform.</text><text x="78.0" y="198" class="s">Real-time multi-user DXF editing, GPU point</text><text x="78.0" y="216" class="s">clouds, NAVER Maps georeferencing.</text><text x="78.0" y="244" class="m">React · Express · PostgreSQL · Three.js</text><line x1="48.0" y1="262" x2="410.0" y2="262" stroke="#d6d0c2"/></g><g><text x="450.0" y="150" class="n">02</text><text x="480.0" y="150" class="t">Remote Control</text><text x="480.0" y="174" class="q" style="font-size:15px">In-house remote support, no TeamViewer.</text><text x="480.0" y="198" class="s">Browser viewer to a tray agent on staff PCs,</text><text x="480.0" y="216" class="s">relayed through the company's own server.</text><text x="480.0" y="244" class="m">React · FastAPI · Flutter · Rust</text><line x1="450.0" y1="262" x2="812.0" y2="262" stroke="#d6d0c2"/></g><g><text x="48.0" y="282" class="n">03</text><text x="78.0" y="282" class="t">Git Scoop</text><text x="78.0" y="306" class="q" style="font-size:15px">Code genealogy from Git history.</text><text x="78.0" y="330" class="s">Native app that traces every function's birth,</text><text x="78.0" y="348" class="s">renames and moves across commits.</text><text x="78.0" y="376" class="m">Rust · gix · Tree-sitter · SQLite · egui</text><line x1="48.0" y1="394" x2="410.0" y2="394" stroke="#d6d0c2"/></g><g><text x="450.0" y="282" class="n">04</text><text x="480.0" y="282" class="t">MyTeam</text><text x="480.0" y="306" class="q" style="font-size:15px">A token-efficient agent orchestrator.</text><text x="480.0" y="330" class="s">Routes each request, delegates to the smallest</text><text x="480.0" y="348" class="s">team of agents, verifies by contract.</text><text x="480.0" y="376" class="m">Agent plugin · JSON Schema · YAML</text><line x1="450.0" y1="394" x2="812.0" y2="394" stroke="#d6d0c2"/></g><g><text x="48.0" y="414" class="n">05</text><text x="78.0" y="414" class="t">LayLingo</text><text x="78.0" y="438" class="q" style="font-size:15px">Translate a PDF where it stands.</text><text x="78.0" y="462" class="s">Click any text in a PDF, get Korean in place,</text><text x="78.0" y="480" class="s">restyle the translation live.</text><text x="78.0" y="508" class="m">React · TypeScript · OpenAI API</text><line x1="48.0" y1="526" x2="410.0" y2="526" stroke="#d6d0c2"/></g><g><text x="450.0" y="414" class="n">06</text><text x="480.0" y="414" class="t">Gitagotchi</text><text x="480.0" y="438" class="q" style="font-size:15px">A pet that grows with your commits.</text><text x="480.0" y="462" class="s">VS Code extension: quests, raids, seasons,</text><text x="480.0" y="480" class="s">rebirth. Shipped in four languages.</text><text x="480.0" y="508" class="m">TypeScript · VS Code API · Git</text><line x1="450.0" y1="526" x2="812.0" y2="526" stroke="#d6d0c2"/></g><g><text x="48.0" y="546" class="n">07</text><text x="78.0" y="546" class="t">please_readme</text><text x="78.0" y="570" class="q" style="font-size:15px">GitHub profile cards, rendered on the edge.</text><text x="78.0" y="594" class="s">Live stats into an image card via Vercel OG,</text><text x="78.0" y="612" class="s">with preview and one-click markdown.</text><text x="78.0" y="640" class="m">Next.js · Satori · GitHub API</text><line x1="48.0" y1="658" x2="410.0" y2="658" stroke="#d6d0c2"/></g><g><text x="450.0" y="546" class="n">08</text><text x="480.0" y="546" class="t">DSA</text><text x="480.0" y="570" class="q" style="font-size:15px">Keeps a sleepy database awake.</text><text x="480.0" y="594" class="s">Windows tray app with scheduled keep-alives,</text><text x="480.0" y="612" class="s">KakaoWork alerts and daily reports.</text><text x="480.0" y="640" class="m">Go · Inno Setup · Task Scheduler</text><line x1="450.0" y1="658" x2="812.0" y2="658" stroke="#d6d0c2"/></g><line x1="48" y1="694" x2="812" y2="694" stroke="#141414" stroke-width="2"/></svg>